name: Match Discovery

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: match-discovery
  cancel-in-progress: false

jobs:
  match-discovery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Validate Python
        run: |
          python -m py_compile match_discovery.py

      - name: Test match selection rules
        run: |
          python -m unittest -v test_match_selection.py

      - name: Test historical competition selection rules
        run: |
          python -m unittest -v test_historical_competitions.py

      - name: Test 10 Champions League fixtures across stages
        run: |
          python -m unittest -v test_ucl_10_matches.py

      - name: Discover automatic matches
        run: |
          python match_discovery.py

      - name: Save matches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add matches.json

          if git diff --cached --quiet; then
            echo "No matches changes."
          else
            git commit -m "Update automatic football matches"
            git push
          fi
