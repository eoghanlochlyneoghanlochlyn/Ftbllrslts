name: Match Discovery

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: match-discovery
  cancel-in-progress: false

jobs:
  match-discovery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run ONLY exhaustive UCL 2025/26 test
        run: |
          python -m unittest -v test_ucl_2025_26_exhaustive.py


