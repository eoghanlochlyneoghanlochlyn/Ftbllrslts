name: Live Telegram Logic Tests

on:
  workflow_dispatch:

jobs:
  live-telegram-logic-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run live Telegram logic tests
        env:
          TELEGRAMBOT: \${{ secrets.TELEGRAMBOT }}
          TELEGRAMCHANNEL: \${{ secrets.TELEGRAMCHANNEL }}
        run: python -m unittest -v test_telegram_logic.py
