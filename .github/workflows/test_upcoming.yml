name: Test Upcoming Matches

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-upcoming:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Upcoming Matches Test
        env:
          BIGBALLS_API_KEY: ${{ secrets.BIGBALLS_API_KEY }}
        run: |
          python test_upcoming.py
