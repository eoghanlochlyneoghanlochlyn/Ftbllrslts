name: Stage Page Historical Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-page-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Validate syntax
        run: python -m py_compile match_discovery.py fotmob.py test_stage_page_live.py
      - name: Run read-only historical stage tests
        run: python -m unittest -v test_stage_page_live.py
