name: User 20 Match Selection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selection-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Check all 20 user-provided matches and print reasons
        run: python -u -m unittest -v test_user_20_matches.py
