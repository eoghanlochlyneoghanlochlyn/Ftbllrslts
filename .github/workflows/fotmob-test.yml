name: FotMob Test

on:
  workflow_dispatch:

jobs:
  test-fotmob:
    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: نصب کتابخانه‌ها
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: اجرای آزمایش فوت‌موب
        run: |
          python test_fotmob.py
