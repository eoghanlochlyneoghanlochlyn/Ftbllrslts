name: Test Real Madrid vs Inter

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout our repository
        uses: actions/checkout@v4

      - name: Checkout Football Live API
        uses: actions/checkout@v4
        with:
          repository: Ryzellx/football-live-api
          path: football-live-api

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: football-live-api
        run: npm install

      - name: Build project
        working-directory: football-live-api
        run: npm run build

      - name: Start API
        working-directory: football-live-api
        run: |
          npm start > api.log 2>&1 &
          echo $! > api.pid

          echo "Waiting for API..."

          for i in {1..30}; do
            if curl -s http://localhost:3001/ > /tmp/root.json; then
              echo "API is responding."
              break
            fi

            sleep 2
          done

          echo
          echo "===== API LOG ====="
          cat api.log

          echo
          echo "===== ROOT RESPONSE ====="
          cat /tmp/root.json

          echo
          echo "===== FETCHING MATCHES FOR 2026-09-08 ====="

          curl -s \
            "http://localhost:3001/api/fotmob/matches/date/2026-09-08" \
            > /tmp/matches.json

          echo
          echo "===== SEARCHING FOR REAL MADRID vs INTER ====="

          MATCH=$(python -c "
          import json

          with open('/tmp/matches.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          found = None

          for league in data.get('data', {}).get('leagues', []):
              for match in league.get('matches', []):
                  home = match.get('home', {}).get('name', '')
                  away = match.get('away', {}).get('name', '')

                  if (
                      ('Real Madrid' in home and 'Inter' in away)
                      or
                      ('Inter' in home and 'Real Madrid' in away)
                  ):
                      found = match
                      break

              if found:
                  break

          if found:
              print(json.dumps(found, ensure_ascii=False, indent=2))
          else:
              print('MATCH_NOT_FOUND')
          ")

          echo "$MATCH"

          if [ "$MATCH" = "MATCH_NOT_FOUND" ]; then
            echo
            echo "❌ Real Madrid vs Inter was not found."
            exit 1
          fi

          MATCH_ID=$(echo "$MATCH" | python -c "
          import sys
          import json

          data = json.load(sys.stdin)
          print(data['id'])
          ")

          echo
          echo "===== MATCH ID ====="
          echo "$MATCH_ID"

          echo
          echo "===== FETCHING MATCH DETAILS ====="

          curl -i \
            "http://localhost:3001/api/fotmob/match/$MATCH_ID"
