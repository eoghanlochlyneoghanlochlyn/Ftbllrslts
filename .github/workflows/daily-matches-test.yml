name: Daily Matches Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-daily-matches:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run daily matches test
        run: |
          python test_daily_matches.py
