name: Generate Historical Fixture Manifest

on:
  push:
    branches:
      - main
    paths:
      - generate_historical_fixtures.py
      - auto_matches.json

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python generate_historical_fixtures.py
      - name: Commit generated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historical_fixtures.py
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Generate frozen historical fixture manifest"
            git push
          fi
