name: Generate Frozen Historical Match List

on:
  workflow_dispatch:
  push:
    paths:
      - "generate_historical_fixtures.py"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Generate frozen historical match list
        run: python generate_historical_fixtures.py

      - name: Commit generated list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historical_test_matches.json
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Generate frozen historical match list"
            git push
          fi
