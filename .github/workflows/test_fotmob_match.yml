name: Test FotMob Match

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Test FotMob match page
        run: |
          python - <<'PY'
          import json
          import re
          import requests

          MATCH_ID = "6106242"

          url = f"https://www.fotmob.com/match/{MATCH_ID}"

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/140.0.0.0 Safari/537.36"
              ),
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.9",
              "Referer": "https://www.fotmob.com/",
          }

          print("=" * 70)
          print("FotMob match test")
          print("=" * 70)
          print(f"URL: {url}")
          print()

          session = requests.Session()

          response = session.get(
              url,
              headers=headers,
              timeout=30,
              allow_redirects=True,
          )

          print(f"HTTP status: {response.status_code}")
          print(f"Final URL: {response.url}")
          print(f"HTML length: {len(response.text)}")
          print()

          response.raise_for_status()

          html = response.text

          # ---------------------------------------------------------
          # پیدا کردن __NEXT_DATA__
          # ---------------------------------------------------------

          match = re.search(
              r'<script[^>]+id=["\']__NEXT_DATA__["\'][^>]*>(.*?)</script>',
              html,
              re.DOTALL,
          )

          if not match:
              print("❌ __NEXT_DATA__ پیدا نشد.")
              print()
              print("بخشی از HTML دریافتی:")
              print(html[:3000])
              raise SystemExit(1)

          print("✅ __NEXT_DATA__ پیدا شد.")

          raw_data = match.group(1)

          try:
              data = json.loads(raw_data)
          except json.JSONDecodeError as exc:
              print("❌ خطا در تبدیل __NEXT_DATA__ به JSON")
              print(exc)
              raise SystemExit(1)

          print("✅ JSON با موفقیت خوانده شد.")
          print()

          # ---------------------------------------------------------
          # ذخیره داده برای بررسی
          # ---------------------------------------------------------

          with open("fotmob_match_data.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print("✅ داده کامل در fotmob_match_data.json ذخیره شد.")
          print()

          # ---------------------------------------------------------
          # نمایش ساختار اولیه
          # ---------------------------------------------------------

          print("=" * 70)
          print("ساختار اصلی JSON")
          print("=" * 70)

          if isinstance(data, dict):
              print(list(data.keys()))

          print()

          # ---------------------------------------------------------
          # جستجوی بازگشتی برای پیدا کردن اطلاعات مسابقه
          # ---------------------------------------------------------

          def find_keys(obj, wanted_keys, path="root"):
              results = []

              if isinstance(obj, dict):
                  for key, value in obj.items():
                      current_path = f"{path}.{key}"

                      if key in wanted_keys:
                          results.append(
                              (current_path, value)
                          )

                      results.extend(
                          find_keys(
                              value,
                              wanted_keys,
                              current_path,
                          )
                      )

              elif isinstance(obj, list):
                  for index, value in enumerate(obj):
                      current_path = f"{path}[{index}]"

                      results.extend(
                          find_keys(
                              value,
                              wanted_keys,
                              current_path,
                          )
                      )

              return results

          wanted = {
              "general",
              "header",
              "lineup",
              "lineups",
              "events",
              "stats",
              "matchFacts",
              "content",
          }

          print("=" * 70)
          print("کلیدهای مهم پیدا شده")
          print("=" * 70)

          results = find_keys(data, wanted)

          if not results:
              print("هیچ‌کدام از کلیدهای موردنظر پیدا نشد.")
          else:
              for path, value in results:
                  if isinstance(value, dict):
                      description = (
                          f"dict با {len(value)} کلید"
                      )
                  elif isinstance(value, list):
                      description = (
                          f"list با {len(value)} عضو"
                      )
                  else:
                      description = repr(value)[:200]

                  print(f"{path} -> {description}")

          print()

          # ---------------------------------------------------------
          # تلاش برای پیدا کردن اطلاعات قابل نمایش مسابقه
          # ---------------------------------------------------------

          def find_match_objects(obj, path="root"):
              found = []

              if isinstance(obj, dict):
                  keys = set(obj.keys())

                  interesting = (
                      ("home" in keys and "away" in keys)
                      or
                      ("homeTeam" in keys and "awayTeam" in keys)
                      or
                      ("home" in keys and "away" in keys and "status" in keys)
                  )

                  if interesting:
                      found.append((path, obj))

                  for key, value in obj.items():
                      found.extend(
                          find_match_objects(
                              value,
                              f"{path}.{key}",
                          )
                      )

              elif isinstance(obj, list):
                  for index, value in enumerate(obj):
                      found.extend(
                          find_match_objects(
                              value,
                              f"{path}[{index}]",
                          )
                      )

              return found

          match_objects = find_match_objects(data)

          print("=" * 70)
          print("اشیای احتمالی مسابقه")
          print("=" * 70)

          if not match_objects:
              print("❌ شیء واضحی برای مسابقه پیدا نشد.")
          else:
              print(
                  f"تعداد اشیای احتمالی پیدا شده: "
                  f"{len(match_objects)}"
              )

              for path, obj in match_objects[:10]:
                  print()
                  print(f"مسیر: {path}")
                  print(
                      json.dumps(
                          obj,
                          ensure_ascii=False,
                          indent=2,
                      )[:5000]
                  )

          print()

          # ---------------------------------------------------------
          # جستجوی نام تیم‌ها
          # ---------------------------------------------------------

          text = json.dumps(
              data,
              ensure_ascii=False,
          )

          print("=" * 70)
          print("بررسی نام تیم‌ها")
          print("=" * 70)

          for team in [
              "Real Madrid",
              "Inter",
              "Inter Milan",
          ]:
              if team.lower() in text.lower():
                  print(f"✅ {team} پیدا شد.")
              else:
                  print(f"❌ {team} پیدا نشد.")

          print()

          # ---------------------------------------------------------
          # پایان
          # ---------------------------------------------------------

          print("=" * 70)
          print("تست تمام شد.")
          print("=" * 70)
          PY

      - name: Upload FotMob data
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fotmob-match-data
          path: fotmob_match_data.json
          if-no-files-found: ignore
