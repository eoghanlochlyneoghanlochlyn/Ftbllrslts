name: Test DevNeonix SofaScore API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-sofascore:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install DevNeonix SofaScore API
        run: |
          npm init -y
          npm install @devneonix/sofascore-api

      - name: Run SofaScore Test
        run: |
          node test_sofascore_proxy.js
