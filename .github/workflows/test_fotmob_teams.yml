name: Test FotMob Teams

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run FotMob team search
        run: |
          python test_fotmob_teams.py

      - name: Upload team IDs
        uses: actions/upload-artifact@v4
        with:
          name: fotmob-teams
          path: fotmob_teams.json
