name: Pre-Match Logic Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-pre-match-logic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run pre-match logic test
        run: |
          python test_pre_match_logic.py
