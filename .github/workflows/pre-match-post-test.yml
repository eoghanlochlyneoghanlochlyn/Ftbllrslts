name: Pre-Match Post Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-pre-match-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate pre-match posts
        run: |
          python pre_match_post.py
